name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Bootstrap Gradle Wrapper
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: gradle wrapper --gradle-version 9.7.1

      - name: Persist Gradle Wrapper
        if: ${{ github.event_name == 'push' && hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        shell: bash
        run: |
          if git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          git commit -m "chore: add Gradle wrapper binary"
          git push

      - name: Build and test
        run: ./gradlew clean build
