name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)"
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve plugin version from build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 25
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: steps.release.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        if: steps.release.outputs.exists != 'true'
        run: ./gradlew clean build --warning-mode all

      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          JAR="build/libs/CloverCheck-$VERSION.jar"
          test -f "$JAR"
          gh release create "$TAG" "$JAR#CloverCheck-$VERSION.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CloverCheck $VERSION" \
            --generate-notes
