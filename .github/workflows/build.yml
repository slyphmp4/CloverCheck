name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)"
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve plugin version from build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build --warning-mode all

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CloverCheck-${{ steps.version.outputs.version }}
          path: build/libs/CloverCheck-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
