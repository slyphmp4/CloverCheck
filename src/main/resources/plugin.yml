name: CloverCheck
version: '${version}'
main: com.slyph.clovercheck.CloverCheck
api-version: '26.2'
author: slyph
description: Manual player cheat-check workflow for Paper 26.2.
website: https://github.com/slyphmp4/CloverCheck

commands:
  check:
    description: Manage manual player cheat checks.
    usage: /check
    aliases: [clovercheck]

permissions:
  clovercheck.use:
    description: Grants the standard CloverCheck staff command set.
    default: op
    children:
      clovercheck.start: true
      clovercheck.finish: true
      clovercheck.cancel: true
      clovercheck.status: true
      clovercheck.list: true
      clovercheck.history: true
      clovercheck.info: true
      clovercheck.reload: true
      clovercheck.notify: true
      clovercheck.teleport: true
  clovercheck.start:
    default: false
  clovercheck.finish:
    default: false
  clovercheck.cancel:
    default: false
  clovercheck.status:
    default: false
  clovercheck.list:
    default: false
  clovercheck.history:
    default: false
  clovercheck.info:
    default: false
  clovercheck.reload:
    default: false
  clovercheck.notify:
    default: false
  clovercheck.teleport:
    default: false
  clovercheck.confess:
    description: Allows a checked player to confirm a confession.
    default: true
  clovercheck.bypass:
    description: Prevents the player from being placed into a check.
    default: op
  clovercheck.override-bypass:
    description: Allows staff to check a player with clovercheck.bypass.
    default: op
